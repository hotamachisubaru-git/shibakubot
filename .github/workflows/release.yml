name: リリース

on:
  push:
    branches:
      - main
      - master
    paths-ignore:
      - ".github/workflows/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    steps:
      - name: チェックアウト
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bun をセットアップ
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: リリース情報を解決
        id: release_meta
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("node:fs");

            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            const version = String(pkg.version || "").trim();
            if (!version) {
              core.setFailed("package.json の version が未設定です。");
              return;
            }

            const tag = `v${version}`;
            const { owner, repo } = context.repo;

            core.setOutput("tag", tag);
            core.setOutput("bundle_dir", `shibakubot-${tag}`);

            try {
              await github.rest.repos.getReleaseByTag({
                owner,
                repo,
                tag,
              });
              core.info(`Release ${tag} は既に存在するためスキップします。`);
              core.setOutput("should_release", "false");
              return;
            } catch (error) {
              if (error.status !== 404) {
                throw error;
              }
            }

            // Publish the tag only after installation, build, and packaging
            // succeed. action-gh-release creates it using target_commitish.
            core.setOutput("should_release", "true");

      - name: 依存関係をインストール
        if: steps.release_meta.outputs.should_release == 'true'
        run: bun install --frozen-lockfile

      - name: リリース情報を表示
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          echo "Ref: ${GITHUB_REF}"
          echo "SHA: ${GITHUB_SHA}"
          echo "Tag: ${{ steps.release_meta.outputs.tag }}"
          echo "Version: $(bun -p "require('./package.json').version")"

      - name: リリースノートを生成
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          mkdir -p release
          bun scripts/extract-release-notes.mjs > release/release-notes.md

      - name: リリースバンドルを作成
        if: steps.release_meta.outputs.should_release == 'true'
        run: bun run release:bundle

      - name: リリースバンドルを圧縮
        if: steps.release_meta.outputs.should_release == 'true'
        run: |
          cd release
          zip -r "${{ steps.release_meta.outputs.tag }}.zip" "${{ steps.release_meta.outputs.bundle_dir }}"

      - name: GitHub Release を公開
        if: steps.release_meta.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: ${{ steps.release_meta.outputs.tag }}
          body_path: release/release-notes.md
          files: release/${{ steps.release_meta.outputs.tag }}.zip

      - name: 重複リリースをスキップ
        if: steps.release_meta.outputs.should_release != 'true'
        run: echo "package.json の version に対応する Release は既に存在するため、公開をスキップします。"
