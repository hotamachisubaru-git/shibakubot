name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - bun
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Bun (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Audit dependencies
        run: bun audit

      - name: Run unit tests
        run: bun test

      - name: Build
        run: bun run build

      - name: Verify bundled SQLite driver
        run: bun -e "const Database = require('better-sqlite3'); const db = new Database(':memory:'); db.exec('CREATE TABLE t (x INTEGER)'); db.prepare('INSERT INTO t VALUES (1)').run(); if (db.prepare('SELECT x FROM t').get().x !== 1) process.exit(1); db.close();"
